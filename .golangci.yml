version: '2'

linters:
  default: standard
  enable:
    - dupl
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.Tx).Rollback
        - (*go.mongodb.org/mongo-driver/v2/mongo.Client).Disconnect
  exclusions:
    presets:
      - std-error-handling
    rules:
      - linters:
          - staticcheck
        text: 'ST1005:'
    paths:
      - third_party$
      - builtin$
      - examples$
      - node_modules

formatters:
  enable:
    - gofumpt
    - goimports
