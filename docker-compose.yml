version: "3.9"
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: kameha
      POSTGRES_PASSWORD: kameha
      POSTGRES_DB: kamehadb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-init/postgres:/docker-entrypoint-initdb.d

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: kameha
      MYSQL_DATABASE: kamehadb
      MYSQL_USER: kameha
      MYSQL_PASSWORD: kameha
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker-init/mysql:/docker-entrypoint-initdb.d

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: kameha
      MARIADB_DATABASE: kamehadb
      MARIADB_USER: kameha
      MARIADB_PASSWORD: kameha
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker-init/mariadb:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  duckdb:
    image: duckdb/duckdb:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - duckdb_data:/data

  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  postgres_data:
  mysql_data:
  mariadb_data:
  redis_data:
  duckdb_data:
  mongodb_data:
