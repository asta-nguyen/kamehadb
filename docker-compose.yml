version: "3.9"
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: kameha
      POSTGRES_PASSWORD: kameha
      POSTGRES_DB: kamehadb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-init/postgres:/docker-entrypoint-initdb.d

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: kameha
      MYSQL_DATABASE: kamehadb
      MYSQL_USER: kameha
      MYSQL_PASSWORD: kameha
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker-init/mysql:/docker-entrypoint-initdb.d

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: kameha
      MARIADB_DATABASE: kamehadb
      MARIADB_USER: kameha
      MARIADB_PASSWORD: kameha
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker-init/mariadb:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  duckdb:
    image: duckdb/duckdb:latest
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - duckdb_data:/data

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - tigerbeetle_data:/data
    security_opt:
      - seccomp=unconfined
    entrypoint: []
    command: >
      sh -c "
      test -f /data/0_0.tigerbeetle || /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 --development /data/0_0.tigerbeetle;
      /tigerbeetle start --addresses=0.0.0.0:3000 --development /data/0_0.tigerbeetle
      "

  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  qdrant:
    image: qdrant/qdrant:v1.13.6
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  mysql_data:
  mariadb_data:
  redis_data:
  duckdb_data:
  tigerbeetle_data:
  mongodb_data:
  qdrant_data:
