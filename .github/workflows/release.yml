name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to release (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release_tag.outputs.value }}
    steps:
      - name: Resolve release tag
        id: release_tag
        run: echo "value=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.value }}
          name: KamehaDB ${{ steps.release_tag.outputs.value }}
          draft: true
          prerelease: ${{ contains(steps.release_tag.outputs.value, 'alpha') || contains(steps.release_tag.outputs.value, 'beta') || contains(steps.release_tag.outputs.value, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-wails:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            wails_platform: 'darwin/universal'
            artifact_name: 'macos-universal'
          - platform: 'ubuntu-22.04'
            wails_platform: 'linux/amd64'
            artifact_name: 'linux-amd64'
          - platform: 'windows-latest'
            wails_platform: 'windows/amd64'
            artifact_name: 'windows-amd64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev gcc

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Wails app (macOS)
        if: matrix.platform == 'macos-latest'
        run: wails build -platform ${{ matrix.wails_platform }}

      - name: Build Wails app (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: wails build -platform ${{ matrix.wails_platform }} -tags webkit2_41

      - name: Build Wails app (Windows)
        if: matrix.platform == 'windows-latest'
        run: wails build -platform ${{ matrix.wails_platform }}

      - name: Package macOS bundle
        if: matrix.platform == 'macos-latest'
        run: |
          cd build/bin
          ditto -c -k --sequesterRsrc --keepParent kamehadb.app ../../kamehadb-${{ matrix.artifact_name }}.zip

      - name: Package Linux binary
        if: matrix.platform == 'ubuntu-22.04'
        run: tar -czf kamehadb-${{ matrix.artifact_name }}.tar.gz -C build/bin kamehadb

      - name: Package Windows binary
        if: matrix.platform == 'windows-latest'
        run: copy "build\bin\kamehadb.exe" "kamehadb-${{ matrix.artifact_name }}.exe"
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            kamehadb-*.zip
            kamehadb-*.tar.gz
            kamehadb-*.exe

  publish-release-assets:
    needs:
      - create-release
      - build-wails
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: List downloaded artifacts
        run: find release-assets -type f | sort

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: |
            release-assets/**/*.zip
            release-assets/**/*.exe
            release-assets/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
