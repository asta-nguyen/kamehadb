name: Screenshot Refresh

# Runs the AI Compare screenshot capture script on every release tag
# and commits updated images back to the repo so the landing site
# always shows fresh screenshots for each release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Capture dependencies run without write credentials; add them only after capture.
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install landing dependencies
        run: npm --prefix landing ci

      - name: Install Playwright Chromium
        run: npx --prefix landing playwright install chromium --with-deps

      - name: Capture screenshots
        run: node landing/scripts/capture-images.mjs

      - name: Configure Git credentials for screenshot commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth_header"

      - name: Commit updated screenshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: refresh AI Compare screenshots [skip ci]'
          file_pattern: 'landing/public/images/*.png'
          commit_options: '--no-verify'

      - name: Remove Git credentials
        if: always()
        run: git config --local --unset-all http.https://github.com/.extraheader || true
